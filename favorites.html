<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Read Later</title>
    <link rel="stylesheet" href="/src/style.css" />
    <link rel="icon" type="image/png" href="/assets/favicon.png" />
  </head>
  <body>
    <audio id="bg-music" muted loop preload="auto">
      <source src="/assets/bg.mp3" type="audio/mpeg" />
    </audio>

    <header id="favorites-header">
      <div id="hero-bookshelf-container">
        <h1 id="title"><a href="/mod-4-project/">ReadMe Maybe?</a></h1>
      </div>
    </header>

    <main id="favorites-section">
      <h2>Read Later</h2>
      <ul id="favorites-list"></ul>
    </main>

    <!--  Modal -->
    <div class="modal-overlay" hidden>
      <div class="modal-backdrop"></div>
      <div class="modal-content" role="dialog" aria-modal="true">
        <button class="close-modal-btn" aria-label="Close modal">✕</button>
        <div class="modal-body"></div>
      </div>
    </div>

    <footer>
      <p>Powered by Open Library</p>
    </footer>

    <script type="module" src="/src/favorites.js"></script>
  </body>
</html>
